<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lifeblood</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07050b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lifeblood">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#030204;color:#f3f0ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));background-image:radial-gradient(520px 380px at 92% -4%,rgba(100,60,200,.22),transparent 70%),radial-gradient(460px 380px at 104% 78%,rgba(90,40,170,.14),transparent 70%)}
.box{width:100%;max-width:420px;background:linear-gradient(135deg,#030207 0%,#07040f 30%,#0e0723 68%,#190c38 100%);border:1px solid rgba(190,160,255,.16);border-top-color:rgba(255,255,255,.2);border-radius:20px;padding:24px 20px;box-shadow:0 3px 0 #0e0a1c,0 5px 0 #060410,0 16px 26px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.1)}
img{display:block;width:72px;height:72px;margin:0 auto 14px;border-radius:18px}
h1{font-size:20px;text-align:center;letter-spacing:3px;text-transform:uppercase;color:#cdbcff}
p{font-size:13.5px;line-height:1.5;color:#b3a9da;margin:12px 0}
label{display:block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#8f84bd;font-weight:700;margin:16px 0 6px}
input{width:100%;background:#050309;border:1px solid rgba(190,160,255,.22);border-radius:10px;color:#fff;padding:12px;font-size:14px}
button{width:100%;margin-top:14px;padding:13px;border-radius:12px;border:1px solid rgba(200,175,255,.4);background:linear-gradient(180deg,rgba(150,110,255,.34),rgba(90,50,200,.2));color:#fff;font-size:15px;font-weight:800;cursor:pointer}
button.sec{background:none;border-color:rgba(190,160,255,.22);color:#b3a9da;font-weight:700;font-size:13px}
.err{color:#f87171;font-size:12.5px;margin-top:8px;min-height:16px}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#030204;display:none}
#go{display:none;text-align:center}
</style>
</head>
<body>
<div class="box" id="setup" style="display:none">
  <img src="icon-192.png" alt="">
  <h1>Lifeblood</h1>
  <p>Prima apertura: incolla l'indirizzo della tua app (quello che finisce con <b>/exec</b>). Lo ricorderò su questo dispositivo.</p>
  <label for="u">Indirizzo della web app</label>
  <input id="u" type="url" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="https://script.google.com/macros/s/.../exec">
  <div class="err" id="err"></div>
  <button id="save">Salva e apri</button>
</div>
<div class="box" id="go">
  <img src="icon-192.png" alt="">
  <h1>Lifeblood</h1>
  <p id="gomsg">Apro la tua app…</p>
  <button id="open">Apri Lifeblood</button>
  <button class="sec" id="chg">Cambia indirizzo</button>
</div>
<iframe id="frame" allow="clipboard-write" title="Lifeblood"></iframe>
<script>
(function(){
  var K='lb_url',M='lb_mode';
  function g(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function s(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function d(k){try{localStorage.removeItem(k)}catch(e){}}
  var q=new URLSearchParams(location.search);
  if(q.get('reset')==='1'){d(K);history.replaceState(null,'',location.pathname)}
  if(q.get('m')==='frame'||q.get('m')==='direct'){s(M,q.get('m'));history.replaceState(null,'',location.pathname)}
  if(q.get('u')){s(K,q.get('u'));history.replaceState(null,'',location.pathname)}
  function ok(u){return /^https:\/\/script\.google\.com\/(macros\/s\/[^\/]+|a\/macros\/[^\/]+\/s\/[^\/]+)\/exec(\?.*)?$/.test(u)}
  function show(id){['setup','go'].forEach(function(x){document.getElementById(x).style.display=(x===id?'block':'none')});document.getElementById('frame').style.display='none'}
  function launch(u){
    var mode=g(M)||'direct';
    if(mode==='frame'){
      var f=document.getElementById('frame');f.style.display='block';document.getElementById('setup').style.display='none';document.getElementById('go').style.display='none';
      f.src=u;
      setTimeout(function(){ /* se dopo pochi secondi non è utile, offre l'apertura diretta */ },0);
    } else {
      show('go');document.getElementById('gomsg').textContent='Apro la tua app…';
      setTimeout(function(){location.href=u},350);
    }
  }
  var u=g(K);
  if(u&&ok(u)){launch(u)} else {show('setup')}
  document.getElementById('save').onclick=function(){
    var v=document.getElementById('u').value.trim();
    if(!ok(v)){document.getElementById('err').textContent='Indirizzo non valido: deve iniziare con https://script.google.com/ e finire con /exec';return}
    s(K,v);launch(v);
  };
  document.getElementById('open').onclick=function(){var v=g(K);if(v)location.href=v};
  document.getElementById('chg').onclick=function(){d(K);show('setup')};
  if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
</body>
</html>
